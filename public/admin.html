<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXORA — Admin Console</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
  <meta name="theme-color" content="#0a0a0a">
</head>
<body>
  <div class="mobile-wrapper">
    <div class="admin-container">
      <!-- SCREEN A — PASSWORD GATE -->
      <div class="gate-container" id="gateScreen">
        <div class="gate-box">
          <div style="display: flex; align-items: center; gap: 12px;">
            <svg class="brand-header-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 44px; height: 44px;">
              <defs>
                <linearGradient id="admGateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ff7a17" />
                  <stop offset="100%" stop-color="#a855f7" />
                </linearGradient>
              </defs>
              <rect x="10" y="10" width="80" height="80" rx="22" fill="#16181d" stroke="url(#admGateGrad)" stroke-width="4"/>
              <path d="M32 68V32L54 56V32M68 32V68L46 44V68" stroke="url(#admGateGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div>
              <h1 class="app-title">NEXORA</h1>
              <div class="eyebrow" style="margin-top: 2px;">ADMIN CONSOLE</div>
            </div>
          </div>
          <form id="gateForm" style="display: flex; flex-direction: column; gap: 12px;">
            <input type="password" id="gatePassword" class="admin-input" placeholder="Enter password..." autocomplete="current-password">
            <button type="submit" class="btn-primary" style="height: 44px; margin-top: 4px;">Enter</button>
          </form>
          <div id="gateError" class="error-message" style="display: none;">Access denied</div>
        </div>
      </div>

      <!-- SCREEN B — ADMIN DASHBOARD -->
      <div class="dashboard-container" id="dashboardScreen" style="display: none;">
        <!-- TOP HEADER -->
        <div class="admin-header">
          <div style="display: flex; align-items: center; gap: 10px;">
            <svg class="brand-header-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 36px; height: 36px;">
              <defs>
                <linearGradient id="admDashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ff7a17" />
                  <stop offset="100%" stop-color="#a855f7" />
                </linearGradient>
              </defs>
              <rect x="10" y="10" width="80" height="80" rx="22" fill="#16181d" stroke="url(#admDashGrad)" stroke-width="4"/>
              <path d="M32 68V32L54 56V32M68 32V68L46 44V68" stroke="url(#admDashGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div>
              <h1 class="app-title" style="font-size: 20px;">NEXORA ADMIN</h1>
              <div class="eyebrow">ADMIN CONSOLE</div>
            </div>
          </div>
          <div style="display: flex; gap: 8px; align-items: center;">
            <a href="/" class="btn-outline btn-sm" id="backToAppBtn" style="text-decoration: none; display: inline-flex; align-items: center;">← Launcher</a>
            <button type="button" class="btn-outline btn-sm" id="logoutBtn">Logout</button>
          </div>
        </div>

        <!-- ADD PLATFORM FORM -->
        <section style="margin-bottom: 32px;">
          <div class="eyebrow" style="margin-bottom: 12px;">ADD PLATFORM</div>
          <form id="addPlatformForm" class="admin-form">
            <div class="form-group">
              <label class="form-label" for="appName">App Name</label>
              <input type="text" id="appName" class="admin-input" placeholder="e.g. Physics Wallah" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="appUrl">App URL</label>
              <input type="url" id="appUrl" class="admin-input" placeholder="https://www.pw.live" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="appLogo">Logo URL</label>
              <input type="url" id="appLogo" class="admin-input" placeholder="https://example.com/logo.png">
            </div>
            <div class="form-group">
              <label class="form-label" for="appCategory">Category</label>
              <input type="text" id="appCategory" class="admin-input" placeholder="e.g. Live Class" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="appOrder">Display Order</label>
              <input type="number" id="appOrder" class="admin-input" placeholder="1" value="1" min="1" required>
            </div>
            <div class="form-group">
              <div class="toggle-wrapper">
                <span class="form-label">Featured Platform</span>
                <label class="toggle-switch">
                  <input type="checkbox" id="appFeatured">
                  <span class="toggle-slider"></span>
                </label>
              </div>
            </div>
            <button type="submit" class="btn-primary btn-add-platform">Add Platform</button>
          </form>
        </section>

        <div class="hairline" style="margin-bottom: 24px;"></div>

        <!-- CONFIGURED PLATFORMS LIST -->
        <section>
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
            <div class="eyebrow">CONFIGURED PLATFORMS</div>
            <div class="mono" style="font-size: 12px; color: var(--ink-mute);" id="platformCount">Platform count: 0</div>
          </div>
          <div class="admin-list" id="adminList">
            <!-- Configured platforms rendered here -->
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
